services:
  - type: web
    name: acolyte-dashboard-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: MONGODB_URI
        scope: build,runtime
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: https://dashboard.vercel.app